<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Bienvenido! | Portal de Acceso</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0F0F12;
            color: #FFFFFF;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image:
                radial-gradient(at 10% 10%, rgba(30, 144, 255, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(255, 0, 128, 0.1) 0px, transparent 50%);
        }

        .welcome-card {
            background: rgba(25, 25, 30, 0.95);
            padding: 60px 50px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .main-greeting {
            font-weight: 900;
            font-size: 3em;
            letter-spacing: -2px;
            margin: 0;
            background: linear-gradient(135deg, #1E90FF 0%, #FF0080 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .code-box {
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            text-align: left;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.9em;
            color: #C5C6C7;
            margin-top: 20px;
        }

        .code-annotation { color: #5C6BC0; }
        .code-keyword { color: #80CBC4; }
        .code-string { color: #FFD54F; }

        a {
            color: #AAA;
            text-decoration: none;
            display: inline-block;
            margin-top: 30px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
<div class="welcome-card">
    <div style="font-size: 3em; margin-bottom: 10px;">⚡</div>
    <p style="color: #AAA; margin: 0;">Acceso Generado para:</p>

    <h1 class="main-greeting" th:text="'¡Hola Mundo, ' + ${usuarioFinal} + '!'">¡Hola Mundo!</h1>

    <div class="code-box">
        <div><span class="code-annotation">// API Response Mapping</span></div>
        <div><span class="code-keyword">return</span> <span class="code-string">"¡Hola Mundo, "</span> + <span class="code-string">"${usuarioFinal}"</span>;</div>
    </div>

    <a href="/">← Volver al Portal</a>
</div>
</body>
</html>
