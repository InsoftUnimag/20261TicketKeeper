
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saint Villain | Almighty :: Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* Estilos Globales Modo Oscuro */
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0F0F12; /* Fondo casi negro */
            color: #FFFFFF; /* Texto blanco */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-image:
                radial-gradient(at 10% 10%, rgba(30, 144, 255, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(255, 0, 128, 0.1) 0px, transparent 50%);
        }

        /* Contenedor Principal (Tarjeta) */
        .portal-container {
            background: rgba(25, 25, 30, 0.95); /* Gris oscuro */
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }


        .logo {
            font-size: 4em;
            font-weight: 900;
            letter-spacing: -5px;
            background: linear-gradient(135deg, #1E90FF 0%, #FF0080 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        /* Títulos */
        h1 { font-weight: 700; margin-bottom: 5px; font-size: 2em; }
        h3 { font-weight: 400; color: #AAA; margin-top: 0; margin-bottom: 30px; }

        /* Formulario y Inputs */
        form { display: flex; flex-direction: column; gap: 15px; }

        input[type="text"] {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #FFFFFF;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 1.1em;
            transition: border-color 0.3s, background-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #1E90FF; /* Azul al enfocar */
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Botón de Envío */
        button {
            background: linear-gradient(135deg, #1E90FF 0%, #FF0080 100%);
            border: none;
            color: #FFFFFF;
            padding: 18px;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.2s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
<div class="portal-container">
    <div class="logo">Unimagdalena</div>
    <h1>Almighty Portal</h1>
    <h3>Ingresa tu Nombre de Usuario</h3>

    <form action="/saludo-final" method="get">
        <input type="text" name="nombreUsuario" placeholder="Tu nombre artístico..." required>
        <button type="submit">Generar Acceso</button>
    </form>
</div>
</body>
</html>
