spring.application.name=ingreso

# Postgres connection (override via env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ticker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ticker_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema management (empty DB -> tables will be created)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 console is only applicable when using H2 datasource
spring.h2.console.enabled=false
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.seed.enabled=${APP_SEED_ENABLED:true}
modules.modulo1.base-url=${MODULO1_BASE_URL:https://uncoated-unfixed-imaginary.ngrok-free.dev}

