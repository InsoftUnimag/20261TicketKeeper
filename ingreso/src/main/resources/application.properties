spring.application.name=ingreso
server.port=${SERVER_PORT:8083}
spring.datasource.url=jdbc:h2:mem:ingresodb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
app.seed.enabled=true
modules.modulo1.base-url=${MODULO1_BASE_URL:https://uncoated-unfixed-imaginary.ngrok-free.dev}
